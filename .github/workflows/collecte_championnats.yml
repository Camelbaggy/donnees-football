name: Championnats (collecte d'un jour ou d'une plage)

# Collecte ESPN (flux Opta) des championnats nationaux pour un jour ou une plage de jours et publie championnats/ sur main.
# Le code est celui de Camelbaggy/coupes-europe (dépôt public), branche `ref` (main par défaut) : run_ligues.py.
# Étape 3 : lancé chaque jour par la veille (battement.yml / veille_secours.yml, veille_ligues.py) avec `date` ; écrit aussi
# etat_championnats.json (lu par la veille et par la notification commune du dépôt de code). Échec = alerte ntfy (secret
# NTFY_TOPIC de ce dépôt ; absent = simulation), une par jour et par cause.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Jour (AAAA-MM-JJ ; vide = aujourd''hui UTC)'
        required: false
        type: string
      du:
        description: 'Plage : premier jour (AAAA-MM-JJ, avec « au »)'
        required: false
        type: string
      au:
        description: 'Plage : dernier jour'
        required: false
        type: string
      ligues:
        description: 'Championnats (fl1,pl,liga,sa,bl)'
        required: false
        default: 'fl1,pl,liga,sa,bl'
        type: string
      ref:
        description: 'Branche du code (coupes-europe)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: championnats
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Camelbaggy/coupes-europe
          ref: ${{ inputs.ref }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collecte
        env:
          PYTHONUNBUFFERED: "1"
          JOUR: ${{ inputs.date }}
          DU: ${{ inputs.du }}
          AU: ${{ inputs.au }}
          LIGUES: ${{ inputs.ligues }}
        run: |
          OPTS="--donnees $GITHUB_WORKSPACE --ligues ${LIGUES:-fl1,pl,liga,sa,bl}"
          if [ -n "$DU" ]; then OPTS="$OPTS --du $DU --au ${AU:-$DU}"; elif [ -n "$JOUR" ]; then OPTS="$OPTS --date $JOUR"; fi
          cd code && python run_ligues.py $OPTS --etat

      - name: Fiches de club et de joueur (jamais bloquant)
        if: ${{ !cancelled() }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd code && python fiches_ligues.py --donnees "$GITHUB_WORKSPACE" || echo "::warning::fiches non mises à jour"
      - name: Publication
        env:
          JOURS: ${{ inputs.date }}${{ inputs.du }}${{ inputs.au && ' -> ' || '' }}${{ inputs.au }}
        run: |
          .github/scripts/publier.sh "chore: championnats ${JOURS:-du jour} (collecte)"

      - name: Alerte d'échec
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOUR: ${{ inputs.date || inputs.du }}
        run: |
          J=${JOUR:-$(date -u +%F)}
          cd code && python run_ligues.py --alerte "$J" --cause workflow --donnees "$GITHUB_WORKSPACE" || true
          cd "$GITHUB_WORKSPACE" && .github/scripts/publier.sh "chore: alerte championnats $J" || true
